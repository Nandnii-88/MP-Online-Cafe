<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - MP Cafe Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="cafe-hero" class="hero-header">
        <div class="hero-content">
            <h1 id="cafe-title">Loading...</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> Change Cafe</a>
        </div>
    </div>

    <div class="container">
        <section class="menu-section">
            <h2 class="section-title">🍱 Main Course</h2>
            <div id="main-course-list" class="menu-grid"></div>
        </section>

        <section class="menu-section">
            <h2 class="section-title">🍟 Snacks</h2>
            <div id="snacks-list" class="menu-grid"></div>
        </section>

        <section class="menu-section">
            <h2 class="section-title">🥤 Drinks & Desserts</h2>
            <div id="drinks-list" class="menu-grid"></div>
        </section>
    </div>

    <div class="floating-total">
        <p>Current Total: <span>₹<span id="total-price">0</span></span></p>
    </div>

    <script src="menu.js"></script>
<a href="index.html" class="back-btn" id="fix-back-btn">
    <i class="fas fa-chevron-left"></i> Change Cafe
</a></body>
</html>
